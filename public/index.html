<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" id="favicon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- 1. Título por defecto (Fallback) -->
  <title>Administración Rest</title>

  <!-- 2. Script para inyectar el nombre de la empresa antes de que cargue React -->
  <script>
    try {
      const empresaData = localStorage.getItem("empresa") || sessionStorage.getItem("empresa");
      if (empresaData) {
        const miEmpresa = JSON.parse(empresaData);

        if (miEmpresa && miEmpresa.nombre) {
          document.title = miEmpresa.nombre;
        }
        if (miEmpresa && miEmpresa.logo_url) {
          const favicon = document.getElementById("favicon");
          if (favicon) {
            favicon.href = miEmpresa.logo_url;
          }
        }
      }
    } catch (error) {
      console.error("Error al cargar los datos de la empresa en el HTML estático:", error);
    }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
